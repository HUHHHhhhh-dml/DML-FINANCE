# =============================================================================
# DML-FINANCE - compila el .app de macOS en la nube y lo adjunta a la release
#
# Por que existe
# --------------
# Un bundle .app SOLO se puede construir en macOS: PyInstaller no puede
# generarlo desde Linux ni desde Windows. Este flujo usa un runner de macOS de
# GitHub (gratis para repositorios publicos) para que no haga falta compilar en
# un Mac propio ni tener el entorno preparado.
#
# Como se usa
# -----------
#   GitHub > pestana "Actions" > "macOS (.app + .dmg + .zip)" > "Run workflow"
#
# Deja el .dmg y el .zip como artefactos descargables de la ejecucion. Si
# escribes una etiqueta (por ejemplo v1.0.0) y marcas "publicar_en_release", los
# adjunta tambien a esa release.
#
# Nota sobre la firma
# -------------------
# El .app se firma en modo ad-hoc (gratis, sin cuenta de Apple). No se notariza,
# asi que en el Mac de destino el primer arranque pide confirmacion (clic derecho
# -> Abrir). Ver INSTALACION-MAC.md.
# =============================================================================

name: macOS (.app + .dmg + .zip)

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release a la que adjuntar los archivos (ej. v1.0.0). Vacio = solo artefactos."
        required: false
        default: ""
      publicar_en_release:
        description: "Adjuntar el .dmg y el .zip a esa release (si existe)"
        required: false
        type: boolean
        default: false

# Necesario para poder subir archivos a una release.
permissions:
  contents: write

jobs:
  construir:
    name: Construir DML-FINANCE.app
    # macos-latest es Apple Silicon (arm64) en la actualidad, que es el objetivo.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Comprobar la arquitectura del runner
        run: |
          echo "Arquitectura: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::warning::El runner no es arm64; el .app no correra en Apple Silicon."
          fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # Se usa 3.14 a proposito: es la version con la que se probo el
          # empaquetado en Linux, asi que las versiones de PySide6, pandas y
          # numpy coinciden con las verificadas.
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar el icono .icns
        run: python generar_icns.py

      - name: Construir el .app (con firma ad-hoc)
        run: python empaquetar_mac.py --app

      - name: Autoprueba del .app
        # Es la comprobacion mas importante: valida las 11 pestanas, los 12
        # criterios y las 11 hojas de Excel sin abrir ventana.
        run: |
          EJECUTABLE="dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE"
          QT_QPA_PLATFORM=offscreen "$EJECUTABLE" --autotest --autotest-salida "$RUNNER_TEMP/autotest.txt" || true
          cat "$RUNNER_TEMP/autotest.txt" || true
          if ! grep -q "RESULTADO: OK" "$RUNNER_TEMP/autotest.txt" 2>/dev/null; then
            echo "::error::La autoprueba del .app fallo"
            exit 1
          fi
          echo "Autoprueba: OK"

      - name: Verificar el bundle (scripts del proyecto)
        run: DML_SIN_GUI=1 bash tests/verificar_mac.sh dist/DML-FINANCE.app

      - name: Crear el .dmg y el .zip
        run: python empaquetar_mac.py --dmg --zip

      - name: Resumen
        run: |
          echo "### Archivos generados" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/*.dmg dist/*.zip >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Comprobacion | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          lipo -archs dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE \
            | sed 's/^/| Arquitecturas | /' >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el .dmg y el .zip como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: DML-FINANCE-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar a la release
        if: ${{ inputs.publicar_en_release && inputs.etiqueta != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.etiqueta }}
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
