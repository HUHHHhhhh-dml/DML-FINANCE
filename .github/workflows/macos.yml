# =============================================================================
# DML-FINANCE - compila el .app de macOS en la nube y lo adjunta a la release
#
# Por que existe
# --------------
# Un bundle .app SOLO se puede construir en macOS: PyInstaller no puede
# generarlo desde Linux ni desde Windows. Este flujo usa un runner de macOS de
# GitHub (gratis para repositorios publicos) para que no haga falta compilar en
# un Mac propio ni tener el entorno preparado.
#
# Como se usa
# -----------
#   GitHub > pestana "Actions" > "macOS (.app + .dmg + .zip)" > "Run workflow"
#
# Deja el .dmg y el .zip como artefactos descargables de la ejecucion. Si
# escribes una etiqueta (por ejemplo v1.0.0) y marcas "publicar_en_release", los
# adjunta tambien a esa release.
#
# Nota sobre la firma
# -------------------
# El .app se firma en modo ad-hoc (gratis, sin cuenta de Apple). No se notariza,
# asi que en el Mac de destino el primer arranque pide confirmacion (clic derecho
# -> Abrir). Ver INSTALACION-MAC.md.
# =============================================================================

name: macOS (.app + .dmg + .zip)

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release a la que adjuntar los archivos (ej. v1.0.0). Vacio = solo artefactos."
        required: false
        default: ""
      publicar_en_release:
        description: "Adjuntar el .dmg y el .zip a esa release (si existe)"
        required: false
        type: boolean
        default: false

# Necesario para poder subir archivos a una release.
permissions:
  contents: write

jobs:
  construir:
    name: Construir DML-FINANCE.app
    # macos-latest es Apple Silicon (arm64) en la actualidad, que es el objetivo.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Comprobar la arquitectura del runner
        run: |
          echo "Arquitectura: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::warning::El runner no es arm64; el .app no correra en Apple Silicon."
          fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # Se usa 3.14 a proposito: es la version con la que se probo el
          # empaquetado en Linux, asi que las versiones de PySide6, pandas y
          # numpy coinciden con las verificadas.
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar el icono .icns
        run: python generar_icns.py

      - name: Construir el .app (con firma ad-hoc)
        run: python empaquetar_mac.py --app

      - name: Autoprueba del .app
        # Es la comprobacion mas importante: valida las 11 pestanas, los 12
        # criterios y las 11 hojas de Excel sin abrir ventana.
        run: |
          EJECUTABLE="dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE"
          QT_QPA_PLATFORM=offscreen "$EJECUTABLE" --autotest --autotest-salida "$RUNNER_TEMP/autotest.txt" || true
          cat "$RUNNER_TEMP/autotest.txt" || true
          if ! grep -q "RESULTADO: OK" "$RUNNER_TEMP/autotest.txt" 2>/dev/null; then
            echo "::error::La autoprueba del .app fallo"
            exit 1
          fi
          echo "Autoprueba: OK"

      - name: Verificar el bundle (scripts del proyecto)
        id: verificar
        # continue-on-error para que, si falla, se ejecute igualmente el paso de
        # diagnostico. El fallo se reporta al final, en "Fallar si la verificacion
        # no paso".
        continue-on-error: true
        run: |
          set -o pipefail
          DML_SIN_GUI=1 bash --debug tests/verificar_mac.sh dist/DML-FINANCE.app 2>&1 \
            | tee "$RUNNER_TEMP/verificacion.log"
          ESTADO=${PIPESTATUS[0]}
          echo "::group::Resumen de comprobaciones"
          grep -E "\[OK\]|\[FALLO\]" "$RUNNER_TEMP/verificacion.log" || true
          echo "::endgroup::"
          exit "$ESTADO"

      - name: Diagnostico del bundle (solo si algo falla)
        # No se ejecuta si todo va bien. Existe para que un fallo deje toda la
        # informacion necesaria en el registro, sin repetir la ejecucion.
        if: steps.verificar.outcome == 'failure'
        run: |
          echo "=== Estructura del bundle ==="
          find dist/DML-FINANCE.app -maxdepth 3 -not -path "*/_internal/*" | head -40
          echo
          echo "=== Punto de entrada ==="
          ls -la dist/DML-FINANCE.app/Contents/MacOS/ || true
          echo
          echo "=== Arquitecturas ==="
          lipo -archs dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE || true
          echo
          echo "=== Firma ==="
          codesign -dv dist/DML-FINANCE.app 2>&1 | head -10 || true
          echo
          echo "=== Info.plist ==="
          plutil -p dist/DML-FINANCE.app/Contents/Info.plist || true
          echo
          echo "=== Autoprueba directa, con salida completa ==="
          QT_QPA_PLATFORM=offscreen dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE --autotest \
            --autotest-salida "$RUNNER_TEMP/at2.txt" 2>&1 | tail -30 || true
          echo "--- contenido del informe ---"
          cat "$RUNNER_TEMP/at2.txt" 2>/dev/null || echo "(no se genero informe)"
          echo
          echo "=== python3 del runner y modulos que usa el script ==="
          python3 -c "import sys; print(sys.executable, sys.version)" || true
          python3 -c "import PIL; print('Pillow', PIL.__version__)" 2>&1 | head -2 || true

      - name: Fallar si la verificacion no paso
        # Se evalua despues del diagnostico, para no perder su salida.
        if: always() && steps.verificar.outcome == 'failure'
        run: |
          echo "::error::La verificacion del bundle fallo. Revisa el paso de diagnostico."
          exit 1

      - name: Crear el .dmg y el .zip
        run: python empaquetar_mac.py --dmg --zip

      - name: Resumen
        run: |
          {
            echo "### Archivos generados"
            echo ""
            ls -lh dist/*.dmg dist/*.zip 2>/dev/null || true
            echo ""
            echo "| Comprobacion | Resultado |"
            echo "|---|---|"
            printf '| Arquitecturas | %s |\n' "$(lipo -archs dist/DML-FINANCE.app/Contents/MacOS/DML-FINANCE)"
            printf '| Version de macOS minima | %s |\n' \
              "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/DML-FINANCE.app/Contents/Info.plist)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el .dmg y el .zip como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: DML-FINANCE-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar a la release
        if: ${{ inputs.publicar_en_release && inputs.etiqueta != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.etiqueta }}
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
