    Basic Materials: 16.0
    Utilities: 17.5
    Real Estate: 30.0
    DESCONOCIDO: 20.0
  p_fcf_default:
    Technology: 30.0
    Communication Services: 20.0
    Consumer Cyclical: 22.0
    Consumer Defensive: 20.0
    Healthcare: 21.0
    Financial Services: 12.0
    Industrials: 18.0
    Energy: 10.0
    Basic Materials: 13.0
    Utilities: 16.0
    Real Estate: 24.0
    DESCONOCIDO: 18.0
  pares:
    Technology: ["AAPL", "MSFT", "AVGO", "AMD", "INTC", "QCOM", "TXN", "MU"]
    Communication Services: ["GOOGL", "META", "NFLX", "DIS", "TMUS", "VZ"]
    Consumer Cyclical: ["AMZN", "TSLA", "HD", "MCD", "NKE", "SBUX"]
    Consumer Defensive: ["PG", "KO", "PEP", "COST", "WMT", "PM"]
    Healthcare: ["LLY", "UNH", "JNJ", "MRK", "ABBV", "PFE"]
    Financial Services: ["JPM", "BAC", "WFC", "GS", "MS", "C"]
    Industrials: ["CAT", "GE", "HON", "UPS", "BA", "RTX"]
    Energy: ["XOM", "CVX", "COP", "SLB", "EOG", "PSX"]
    Basic Materials: ["LIN", "SHW", "FCX", "NEM", "DOW"]
    Utilities: ["NEE", "DUK", "SO", "D", "AEP"]
    Real Estate: ["PLD", "AMT", "EQIX", "SPG", "O"]

ui:
  tema: "oscuro"
  tickers_historial: 12
  guardar_geometria: true    # guarda el tema elegido en este archivo

demo:
  ticker: "DEMO"
  spot: 100.0
  meses: 60
